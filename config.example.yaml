# GoBitMule · P0 参考配置（对应 docs/13-构建发布与运维.md §7）
# 复制为 config.yaml 后按需修改；优先级：内置默认 < 配置文件 < 环境变量 < CLI 参数 < API 运行时设置。
listen: "127.0.0.1:0"        # 0 = 随机端口 + 本地发现文件；不占用固定 6800
downloadDir: "~/Downloads/ud"
tempSuffix: ".part"
logLevel: "info"             # debug|info|warn|error
# remoteToken 仅在非回环监听时必填；留空且监听回环时无需鉴权。
# 生产环境请通过环境变量 UD_REMOTE_TOKEN 注入，不要写进配置文件。
remoteToken: ""

# L1 aria2 JSON-RPC facade（ADR-0031，opt-in）：默认 false 时 /jsonrpc 返回 404、
# capabilities.rpcLevel 保持 "L0"；开启后提供 compat subset（25 方法 + 6 通知）
# 供 AriaNg / 浏览器扩展连接。不捆绑 aria2c、不引入第二下载引擎。
rpc:
  enabled: false              # 可用 UD_RPC_ENABLED=true 覆盖

global:
  maxConcurrentTasks: 5
  maxDownloadRate: "8MiB/s"
  maxUploadRate: "2MiB/s"
  maxConnectionsPerTask: 16
  chunkSize: "4MiB"
  diskFlushInterval: "500ms"

security:
  allowedSchemes: ["http", "https", "ftp", "ftps", "sftp"]
  allowedPorts: [80, 443, 21, 22, 990]
  maxRedirects: 3
  maxMetalinkMirrors: 32
  maxXMLBytes: 4194304
  blockPrivateNetworks: true
  # 仅供本地 fixture / 单元测试使用；开启后允许回环地址与任意端口。生产必须保持 false。
  allowLoopbackForDev: false

# bt.* 已生效（ADR-0021 路径 A，2026-11-14）：由 internal/app/daemon.go 注入
# internal/transport/bt.SeedingPolicy。上传字节速率仍统一由 scheduler.Limiter
# 管理，此处只配置连接槽数；私有种子恒不上传、恒禁 DHT/PEX（BT-08 / 不承诺 PT）。
# peerID 必须保持诚实 -UD 前缀（ADR-0017）：非 -UD 前缀会自动回落生成的诚实 ID。
# seedEnabled=true 时 seedRatio 与 seedTimeMinutes 至少一项 > 0（禁止无界做种）。
# 可用 UD_BT_* 环境变量覆盖，详见 docs/07 配置表与 docs/13 §7。
bt:
  peerID: "-UD0000-"          # 前缀占位；完整 20 字节 -UD ID 才按配置使用
  enableDHT: true
  enablePEX: true
  seedEnabled: true
  seedRatio: 1.0              # 上传/下载达到该分享率即停止做种
  seedTimeMinutes: 60         # 或做种满该时长即停止（任一达标）
  maxUploadSlots: 8           # 同时上传连接数上限
  enableUPnP: true            # UPnP / NAT-PMP 端口映射
  listenPort: 0               # 0 = 随机端口
  listenHost: ""              # 空 = 库默认（所有接口）；填 IP 字面量时按地址族关闭另一族监听
ed2k:
  obfuscation: true
  secureIdent: true
  tcpPort: 4662
  udpPort: 4672
  # WBS 16 / ADR-0030: forked goed2k 引擎 opt-in（默认 false = 不注册 eD2k Transport，
  # dispatch 行为不变）。true 时需给 outputDir；KAD/server 引导文件可选。
  enabled: false
  outputDir: ""          # eD2k 完成文件受控目录
  nodesDat: ""           # KAD 引导文件；仓库附带 data/ed2k/nodes.dat（209 真机）
  serverMet: ""          # eD2k server.met；仓库附带 data/ed2k/server.met（209 真机）
plugins:
  verifySignature: true       # 官方规则包强制 Ed25519 校验；关闭必须同时显式 insecure: true
  runtime: "goja"             # 仅实现 goja；wasm 为未来硬隔离升级路径
  dir: ""                    # 规则通道目录；为空 = 不注册任何插件 Resolver
  trustedKeys: []            # base64 Ed25519 公钥；也可由 UD_PLUGIN_KEYS 提供（逗号分隔）
  insecure: false            # 本地开发跳过签名校验；非回环监听时禁止
  reloadInterval: "30s"      # 热更新轮询间隔（1s..24h）
# events.* 审计日志保留策略（docs/06 §7，2026-11-17 生效）：两个上限独立生效，
# 先按时间删过期、再削到最新 N 条，同一事务提交；清理失败只记 warn、下个节拍重试。
# 两项都填 0 会被 config.Validate 拒绝启动（无界审计日志会撑爆磁盘）。
events:
  retentionDays: 7           # 删除早于 N 天的审计事件（0 = 不按时间清理）
  maxRows: 100000            # 只保留最新 N 条（0 = 不限条数）
  pruneInterval: "1h"        # 清理节拍（1m..24h）；空 = 默认 1h
# P2 可选 yt-dlp 站点解析（ADR-0010）：默认关闭，保持零 sidecar 基线。
# 开启后 sidecar 只执行 `-J --skip-download` 吐 JSON；站点 URL 与格式 URL 均过 SSRFGuard。
# UD_YTDLP_ENABLED / UD_YTDLP_BINARY / UD_YTDLP_TIMEOUT 可覆盖；改配置需重启 daemon。
sources:
  telegram:
    enabled: false          # true = 注册 telegram Resolver/Transport（WBS 15，ADR-0029）
    apiId: 0                # Telegram APP 凭据（my.telegram.org）；会话本体走 POST /credentials（钥匙串）
    apiHash: ""             # APP 凭据，不含用户密钥；开启后必填
    timeout: "10m"          # 单次 MTProto 操作上限，10s..30m
  lux:
    enabled: false          # true = 注册 lux 进程内站点解析（ADR-0026，精选 B站/抖音/爱奇艺/芒果/西瓜/快手）
    timeout: "60s"          # 单次提取上限，1s..5m；超时后放弃提取（lux API 不支持 ctx，后台协程自行结束）
  ytdlp:
    enabled: false          # true = 注册 yt-dlp Resolver（仅渐进格式；分离 A/V 明确失败）
    binary: "yt-dlp"        # PATH 名称或绝对路径；不要指向不可信二进制
    timeout: "2m"           # 单次元数据提取上限，1s..30m
    maxBytes: 16777216      # JSON stdout 上限（16MiB），0..1GiB
# P2 可选 ffmpeg Transcode 插件（ADR-0011 / 0012）：默认关闭，保持零 sidecar 基线。
# 开启后只接受已下载到本地的文件；二进制由 operator 提供，不自动下载可执行文件。
# ffmpegBuild 的许可证由 operator 负责；--enable-nonfree 构建会被能力探测拒绝。
# UD_FFMPEG_ENABLED / UD_FFMPEG_BINARY / UD_FFMPEG_THREADS /
# UD_FFMPEG_MAX_CONCURRENT / UD_FFMPEG_TIMEOUT 可覆盖。
postProcess:
  ffmpegEnabled: false       # true = 探测并注册 ffmpeg-transcode；探测失败只降级
  ffmpegBinary: "ffmpeg"     # PATH 名称或绝对路径；不要指向不可信二进制
  ffmpegThreads: 2           # 单进程 -threads，1..64
  ffmpegMaxConcurrent: 1     # 全局转码槽位，1..16；与下载分片哈希分开
  ffmpegTimeout: "30m"       # 单次转码上限，1m..24h
telemetry:
  enabled: false
